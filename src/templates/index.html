<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Status</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/custom.css') }}">
</head>

<body>
    <header class="header">
        <h1>Room Status Dashboard</h1>
    </header>

    <main class="container">
        <section class="card form-card">
            <h2>Update Status</h2>
            <form action="/set_status" method="POST" class="status-form">
                <div class="form-group">
                    <label for="line_one">Line 1</label>
                    <input type="text" id="line_one" name="line_one" maxlength="15" value="{{ status_line_one }}"
                        required>
                </div>
                <div class="form-group">
                    <label for="line_two">Line 2</label>
                    <input type="text" id="line_two" name="line_two" maxlength="28" value="{{ status_line_two }}">
                </div>
                <div class="form-group">
                    <label for="line_three">Line 3</label>
                    <input type="text" id="line_three" name="line_three" maxlength="28" value="{{ status_line_three }}">
                </div>
                <button type="submit" class="btn">Set Status</button>
            </form>
        </section>

        <section class="card preview-card">
            <h2>Live Preview</h2>
            <div class="preview-content">
                <time>{{ now }}</time>
                <p class="line1">{{ status_line_one }}</p>
                <p class="line2">{{ status_line_two }}</p>
                <p class="line3">{{ status_line_three }}</p>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; {{ year }} Aaron Perkel</p>
    </footer>
</body>

</html>
